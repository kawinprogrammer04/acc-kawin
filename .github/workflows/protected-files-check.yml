name: Protected Files Check

# Policy comes from the trusted base, not an editable PR-head config.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-protected-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { protectedPaths, readPatterns } = require('./.github/scripts/pr-policy.cjs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            });
            if (files.length >= 3000) throw new Error('PR มีไฟล์เกินขอบเขต API; แยก PR ก่อนตรวจ');
            const patterns = readPatterns(fs.readFileSync('.github/protected-files.txt', 'utf8'));
            const hits = protectedPaths(files, patterns);
            if (hits.length) core.setFailed(`PR แตะข้อมูล/credential ที่ป้องกันไว้ (รวม rename/delete):\n${hits.join('\n')}\nห้ามลบไฟล์เก่าเพื่อให้ check ผ่าน; ดู docs/deployment.md`);
