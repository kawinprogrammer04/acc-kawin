name: Check PR Base Branch

# Trusted base only: never execute/check out PR-head code with this event.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-base-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { checkRoute, readPatterns } = require('./.github/scripts/pr-policy.cjs');
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            const bases = readPatterns(fs.readFileSync('.github/valid-pr-bases.txt', 'utf8'));
            const error = checkRoute(pr, bases);
            if (error) core.setFailed(error);
