name: CI

on:
  push:
    branches: [Production]
  workflow_dispatch: {}

jobs:
  check-migrations:
    # Guards against the acc-kawin migration incidents of 2026-08-13 and
    # 2026-08-17: two Alembic revisions merged in from parallel branches both
    # pointing at the same down_revision, giving the migration graph two
    # heads. `alembic upgrade head` then picked one arbitrarily/errored
    # inside the backend entrypoint, so the container never went healthy and
    # the deploy job failed after already recreating containers. Catch it
    # here, before the deploy step ever touches the server.
    if: github.ref == 'refs/heads/Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject multiple Alembic heads
        working-directory: backend
        run: |
          pip install --no-cache-dir alembic==1.13.2
          heads="$(alembic heads)"
          echo "$heads"
          head_count="$(grep -c '(head)' <<< "$heads")"
          if [ "$head_count" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head, found $head_count. Rebase/merge the migration branches (fix down_revision chain) before pushing to Production."
            exit 1
          fi

  deploy:
    needs: check-migrations
    # This job intentionally lives in the same workflow file that receives the
    # push event, instead of a separate deploy.yml triggered by `workflow_run`.
    # `workflow_run` always reads the *default branch's* copy of the triggered
    # workflow file, not the branch that produced the event - so a fix landed
    # only on Production could silently never take effect. See kawin-ffm's
    # ci.yml / deploy history for the incident this avoids.
    if: github.ref == 'refs/heads/Production'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to acc.kawinbrothers.com
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ACC_DEPLOY_HOST }}
          username: ${{ secrets.ACC_DEPLOY_USER }}
          key: ${{ secrets.ACC_DEPLOY_SSH_KEY }}
          # Login user (gha_deploy_acc) has no shell privileges of its own -
          # /etc/sudoers.d/gha-deploy-acc on the server allows it to run
          # exactly one fixed, argument-less, root-owned script
          # (/usr/local/bin/deploy-acc-kawin.sh) and nothing else. That script
          # hardcodes the acc-kawin project path, so this grant cannot reach
          # any other tenant/domain on the shared host. The script itself:
          # git reset --hard origin/Production, pg_dump backup, docker compose
          # build + up (backend's entrypoint runs `alembic upgrade head`
          # automatically before Uvicorn starts), then polls /api/health and
          # fails the job (non-zero exit) if it never turns healthy.
          script: sudo /usr/local/bin/deploy-acc-kawin.sh
