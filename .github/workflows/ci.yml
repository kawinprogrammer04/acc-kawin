name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all tracked backend Python sources
        run: |
          python - <<'PY'
          import py_compile
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z', 'backend/*.py', 'backend/**/*.py'])
          for path in paths.decode().split('\0'):
              if path:
                  py_compile.compile(path, doraise=True)
          PY

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check + build
        working-directory: frontend
        run: npm run build

  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject multiple Alembic heads
        working-directory: backend
        run: |
          pip install --no-cache-dir alembic==1.13.2
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          print('Alembic heads:', heads)
          if len(heads) != 1:
              raise SystemExit('Expected exactly one Alembic head; resolve the migration graph before merging.')
          PY

  deployment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/deploy/*.test.cjs
      - run: python -m unittest discover -s tests/deploy -p 'test_*.py' -v
      - name: Shell syntax and static checks
        run: |
          bash -n scripts/deploy/deploy-acc-kawin.sh
          shellcheck scripts/deploy/deploy-acc-kawin.sh

  deploy:
    needs: [backend-lint, frontend-build, check-migrations, deployment-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: acc-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require SSH configuration
        env:
          DEPLOY_HOST: ${{ secrets.ACC_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ACC_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.ACC_DEPLOY_SSH_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.ACC_DEPLOY_HOST_FINGERPRINT }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name; complete docs/deployment.md before releasing."
              exit 1
            fi
          done
      - name: Identify reviewed server script
        id: script
        run: echo "sha256=$(sha256sum scripts/deploy/deploy-acc-kawin.sh | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Deploy the exact commit checked by this workflow
        uses: appleboy/ssh-action@v1
        env:
          ACC_DEPLOY_SHA: ${{ github.sha }}
          ACC_DEPLOY_SCRIPT_SHA256: ${{ steps.script.outputs.sha256 }}
        with:
          host: ${{ secrets.ACC_DEPLOY_HOST }}
          username: ${{ secrets.ACC_DEPLOY_USER }}
          key: ${{ secrets.ACC_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.ACC_DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 40m
          envs: ACC_DEPLOY_SHA,ACC_DEPLOY_SCRIPT_SHA256
          script: |
            set -eu
            printf '%s  %s\n' "$ACC_DEPLOY_SCRIPT_SHA256" /usr/local/bin/deploy-acc-kawin.sh | sha256sum -c -
            printf '%s\n' "$ACC_DEPLOY_SHA" | sudo -n /usr/local/bin/deploy-acc-kawin.sh

  notify:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-notify.yml
