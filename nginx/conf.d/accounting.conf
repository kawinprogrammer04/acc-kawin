# ══════════════════════════════════════════════════════════════════════════════
# accounting.conf — Main virtual host for Thai SME Accounting System
#
# Domain  : accounting.internal  (change to your real domain)
# HTTP    : port 80  → redirect to HTTPS
# HTTPS   : port 443 → React SPA + /api proxy to FastAPI
#
# SSL mode:
#   • Development  — self-signed cert generated by scripts/gen-self-signed.sh
#   • Production   — mount Let's Encrypt / internal CA certs via volume
# ══════════════════════════════════════════════════════════════════════════════

# ── 1. HTTP entry point ───────────────────────────────────────────────────────
# Local development uses http://localhost:8080 to avoid browser warnings from
# the self-signed certificate. In production, Plesk terminates public HTTPS and
# proxies to this private HTTP port.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 25m;

    # ACME challenge (Let's Encrypt webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Reuse the complete HTTPS virtual host internally. Certificate
        # validation is disabled only for this loopback connection.
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# ── 2. Main HTTPS server ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Catch all hostnames; production domain selection is handled by Plesk.
    server_name _;

    # SSL certificate paths (mounted as Docker volume)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Logs
    access_log /var/log/nginx/accounting.access.log main;
    error_log  /var/log/nginx/accounting.error.log  warn;

    root /usr/share/nginx/html;
    index index.html;

    # ── /health — Nginx liveness (no auth, no logging) ───────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── /api — Proxy to FastAPI backend ───────────────────────────────────────
    location ^~ /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_conn perip 20;

        proxy_pass         http://backend;
        proxy_http_version 1.1;

        # Keep-alive to upstream
        proxy_set_header Connection "";

        # Real client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffer settings (reduces backend hold time)
        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         16 8k;
        proxy_busy_buffers_size 16k;

        # Don't forward these headers from backend
        proxy_hide_header X-Powered-By;
    }

    # ── /api/auth/login — Extra rate limit ────────────────────────────────────
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── /api/docs — Swagger UI (restrict to internal IPs in production) ───────
    location /api/docs {
        # Uncomment to restrict to VPN/office subnet:
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny  all;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
    }

    # ── /statement — Credit Statement Matcher (reverse-proxied, same-origin) ──
    # Bare `/statement` (no slash) serves the SPA directly so React Router renders
    # the framed StatementPage (sidebar + iframe). Serving index.html (instead of
    # a redirect to /statement/) avoids nginx's trailing-slash 301, which drops
    # the port behind the 8443→443 Docker map and would break a page refresh.
    location = /statement { try_files /index.html =404; }

    # Everything under `/statement/` (the iframe target) is proxied to the matcher.
    # `^~` wins over the static-asset and SPA regex/prefix below.
    location ^~ /statement/ {
        limit_req  zone=api burst=60 nodelay;
        limit_conn perip 20;

        # Keep the /statement prefix in the upstream URI. The matcher is started
        # with ROOT_PATH=/statement, so its routes and static assets resolve
        # correctly at /statement/upload and /statement/static/styles.css.
        proxy_pass         http://statement:8010;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Prefix /statement;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Statement files (Excel/PDF) may be a few MB
        client_max_body_size 25m;

        # A location-level add_header drops ALL inherited headers, so the global
        # security headers are re-declared here — with a CSP relaxed just enough
        # to load the matcher's Bootstrap CDN, and frame-ancestors 'self' so the
        # accounting SPA can embed it in a same-origin iframe.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    }

    # ── Static assets — aggressive caching ───────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # ── React SPA — catch-all (client-side routing) ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # HTML must not be cached (SPA entry point changes on each deploy)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma        "no-cache";
        }
    }

    # ── Block common attack patterns ──────────────────────────────────────────
    location ~* \.(php|asp|aspx|cgi|pl|sh)$ {
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}

