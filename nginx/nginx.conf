# ── Global Nginx settings ─────────────────────────────────────────────────────
user  nginx;
worker_processes  auto;           # match CPU cores
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # mime.types has no .mjs entry, so ES-module assets (e.g. pdfjs-dist's
    # pdf.worker.min.mjs) fall back to application/octet-stream — combined
    # with the nosniff header below, browsers refuse to execute them as a
    # worker/module script at all (the PDF signature-placement viewer fails
    # silently with "เปิดไฟล์ไม่สำเร็จ" because the pdf.js worker never loads).
    types {
        application/javascript mjs;
    }

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main buffer=16k flush=5s;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        application/javascript
        application/json
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Security defaults (applied before vhost overrides)
    server_tokens     off;

    # Client settings
    client_max_body_size     20m;
    client_body_buffer_size  128k;
    client_header_timeout    15s;
    client_body_timeout      15s;
    send_timeout             15s;

    # Rate limiting zones
    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=5r/m;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;

    # Upstream — FastAPI backend
    upstream backend {
        server            backend:8000;
        keepalive         32;
        keepalive_requests 100;
        keepalive_timeout  60s;
    }

    # Include virtual host configs
    include /etc/nginx/conf.d/*.conf;
}
