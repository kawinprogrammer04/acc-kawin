# ── pg_hba.conf — PostgreSQL client authentication ───────────────────────────
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local UNIX socket — always allow superuser
local   all             postgres                                trust

# Docker internal network — md5 (password) auth for app user
host    accounting_db   postgres        172.16.0.0/12           md5
host    accounting_db   postgres        10.0.0.0/8              md5

# Docker Desktop host gateway — allow local GUI clients through 127.0.0.1:5432
host    accounting_db   postgres        192.168.65.1/32          md5

# Reject everything else
host    all             all             all                     reject
