# ── pg_hba.conf — PostgreSQL client authentication ───────────────────────────
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local UNIX socket — always allow superuser
# (the bootstrap superuser is named after POSTGRES_USER, not always "postgres")
local   all             all                                     trust

# Docker internal network — md5 (password) auth for app user
host    accounting_db   all             172.16.0.0/12           md5
host    accounting_db   all             10.0.0.0/8              md5

# Reject everything else
host    all             all             all                     reject
